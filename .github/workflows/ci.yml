name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Building the test project also builds the website (project reference)
      - run: dotnet build tests/LoopCastsWeb.Tests -c Release
      - run: dotnet test tests/LoopCastsWeb.Tests -c Release --no-build
